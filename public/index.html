<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Login Card -->
        <section id="loginSection" class="card">
            <h2>User Login</h2>
            <div id="loginMessage" class="message"></div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group" style="margin-bottom: 12px;">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter username" required>
                </div>
                
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>

            <div style="margin-top: 14px; font-size: 12px; color: #555; background: #eef2f7; padding: 8px 10px; border-radius: 4px;">
                Demo: <b>admin</b> / <b>admin123</b> (Admin) &bull; <b>staff</b> / <b>staff123</b> (Staff)
            </div>
        </section>


        <!-- Dashboard Screen -->
        <div id="appSection" class="hidden">
            
            <header>
                <div>
                    <h1>Inventory Management System</h1>
                </div>
                <div class="user-info">
                    <span>Welcome, <strong id="userBadge">Admin</strong></span>
                    <button type="button" class="btn btn-danger btn-sm" onclick="handleLogout()">Logout</button>
                </div>
            </header>

            <!-- Stats -->
            <section class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Products</div>
                    <div id="statTotalProducts" class="stat-number">0</div>
                </div>
                <div class="stat-card success">
                    <div class="stat-label">Total Stock</div>
                    <div id="statTotalQuantity" class="stat-number">0</div>
                </div>
                <div class="stat-card alert">
                    <div class="stat-label">Low Stock Items</div>
                    <div id="statLowStock" class="stat-number">0</div>
                </div>
                <div class="stat-card value">
                    <div class="stat-label">Total Value</div>
                    <div id="statTotalValue" class="stat-number">₹0</div>
                </div>
            </section>

            <!-- Product Form -->
            <section class="card" id="formCard">
                <h2 id="formTitle">Add Product</h2>
                <div id="formMessage" class="message"></div>

                <form id="productForm" onsubmit="saveProduct(event)">
                    <input type="hidden" id="productId">

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="productName">Product Name</label>
                            <input type="text" id="productName" placeholder="Product name" required>
                        </div>

                        <div class="form-group">
                            <label for="productCategory">Category</label>
                            <select id="productCategory" required>
                                <option value="">Select Category</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Stationery">Stationery</option>
                                <option value="Grocery">Grocery</option>
                                <option value="Clothing">Clothing</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="productPrice">Price (₹)</label>
                            <input type="number" id="productPrice" min="0" step="0.01" placeholder="Price" required>
                        </div>

                        <div class="form-group">
                            <label for="productQuantity">Quantity</label>
                            <input type="number" id="productQuantity" min="0" placeholder="Quantity" required>
                        </div>

                        <div class="form-group">
                            <label for="productMinStock">Alert Level</label>
                            <input type="number" id="productMinStock" min="1" value="5" placeholder="Minimum stock">
                        </div>
                    </div>

                    <button type="submit" id="saveButton" class="btn btn-primary">Save Product</button>
                    <button type="button" id="cancelButton" class="btn btn-secondary hidden" onclick="cancelEdit()">Cancel</button>
                </form>
            </section>

            <!-- Inventory Table -->
            <section class="card">
                <h2>Product List</h2>

                <div class="filter-bar">
                    <input type="text" id="searchInput" placeholder="Search by name..." oninput="filterProducts()">
                    <select id="categoryFilter" onchange="filterProducts()">
                        <option value="ALL">All Categories</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Stationery">Stationery</option>
                        <option value="Grocery">Grocery</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Stock Adjust</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                    </tbody>
                </table>
            </section>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
